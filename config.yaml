server:
  host: 127.0.0.1
  port: 4001

providers:
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    forward_auth: true

  ollama:
    type: ollama
    base_url: http://localhost:11434
    forward_auth: false

models:
  "claude-*":
    provider: anthropic

  local-lite:
    provider: ollama
    model: qwen3.5:9b
    timeout: 60
    parameters:
      num_ctx: 16384
      num_predict: 2048
      think: false

  local-middle:
    provider: ollama
    model: qwen3.5:9b
    timeout: 120
    parameters:
      num_ctx: 32768
      num_predict: 4096
      think: false

  local-heavy:
    provider: ollama
    model: gpt-oss:20b
    timeout: 300
    parameters:
      num_ctx: 65536
      num_predict: 8192
